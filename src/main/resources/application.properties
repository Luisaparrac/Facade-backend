spring.application.name=medical-management-system
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:h2:mem:clinicdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE:false}

clinic.time-zone=${CLINIC_TIME_ZONE:America/Bogota}
clinic.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://localhost:4200}
clinic.session.hours=${SESSION_HOURS:8}
clinic.seed-demo-data=${SEED_DEMO_DATA:true}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
